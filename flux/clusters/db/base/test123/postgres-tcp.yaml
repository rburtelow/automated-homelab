apiVersion: v1
kind: Service
metadata:
  name: test123-tailscale
  namespace: test123
  annotations:
    tailscale.com/hostname: test123-tcp
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    cnpg.io/cluster: test123
    role: primary
  ports:
  - name: test123-tcp
    port: 443
    targetPort: 5432
    protocol: TCP

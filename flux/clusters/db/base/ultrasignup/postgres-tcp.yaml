apiVersion: v1
kind: Service
metadata:
  name: ultrasignup-tailscale
  namespace: ultrasignup
  annotations:
    tailscale.com/hostname: ultrasignup-tcp
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    cnpg.io/cluster: ultrasignup
    role: primary
  ports:
  - name: ultrasignup-tcp
    port: 443
    targetPort: 5432
    protocol: TCP
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  interval: 10m0s
  timeout: 15m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: sonarqube
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: sonarqube
        namespace: sonarqube
      interval: 10m0s
  valuesFrom:
    - kind: Secret
      name: sonarqube-secret
      valuesKey: monitoringPasscode
      targetPath: monitoringPasscode
    - kind: Secret
      name: sonarqube-secret
      valuesKey: saml.applicationId
      targetPath: sonarProperties.sonar\.auth\.saml\.applicationId
    - kind: Secret
      name: sonarqube-secret
      valuesKey: saml.loginUrl
      targetPath: sonarProperties.sonar\.auth\.saml\.loginUrl
    - kind: Secret
      name: sonarqube-secret
      valuesKey: saml.providerId
      targetPath: sonarProperties.sonar\.auth\.saml\.providerId
    - kind: Secret
      name: sonarqube-secret
      valuesKey: saml.certificate
      targetPath: sonarProperties.sonar\.auth\.saml\.certificate\.secured
  values:
    community:
      enabled: true
    # External PostgreSQL provided by the sonarqube-postgres CloudNativePG
    # cluster. Without this SonarQube falls back to the embedded H2 database in
    # an emptyDir, which is wiped on every pod restart.
    jdbcOverwrite:
      enabled: true
      jdbcUrl: "jdbc:postgresql://sonarqube-postgres-rw:5432/sonarqube"
      jdbcUsername: sonarqube
      jdbcSecretName: sonarqube-postgres-app
      jdbcSecretPasswordKey: password
    # Persist /opt/sonarqube (Elasticsearch index, plugins, extensions).
    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteOnce
      size: 10Gi
    sonarProperties:
      sonar.auth.saml.enabled: "true"
      sonar.auth.saml.providerName: "Authentik"
      sonar.auth.saml.user.login: "login"
      sonar.auth.saml.user.name: "name"
      sonar.auth.saml.user.email: "email"
      # Optional: Enable group synchronization
      # sonar.auth.saml.group.name: "groups"
      # Allow users to sign up
      sonar.auth.saml.allowUsersToSignUp: "true"

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-console
  namespace: rustfs
  annotations:
    tailscale.com/hostname: rustfs
spec:
  ingressClassName: tailscale
  rules:
  - host: rustfs
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rustfs-svc
            port:
              number: 9001
  tls:
  - secretName: rustfs
    hosts:
    - rustfs
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs-s3
  namespace: rustfs
  annotations:
    tailscale.com/hostname: rustfs-s3
spec:
  ingressClassName: tailscale
  rules:
  - host: rustfs-s3
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rustfs-svc
            port:
              number: 9000
  tls:
  - secretName: rustfs-s3
    hosts:
    - rustfs-s3

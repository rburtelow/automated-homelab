apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 10m0s
  timeout: 10m
  chart:
    spec:
      chart: rustfs
      version: '1.0.4'
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: rustfs
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Standalone: Longhorn already replicates the volume, so RustFS erasure
    # coding across multiple pods would just multiply storage overhead.
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    secret:
      existingSecret: rustfs-secret
    storageclass:
      name: longhorn
      dataStorageSize: 1Gi
    config:
      rustfs:
        # Empty disables the logs PVC; logs go to stdout instead.
        obs_log_directory: ""
        region: us-east-1
        console_enable: "true"
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    service:
      type: ClusterIP

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rustfs
  namespace: rustfs
  annotations:
    tailscale.com/hostname: rustfs
spec:
  ingressClassName: tailscale
  rules:
  - host: rustfs
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rustfs-svc
            port:
              number: 9000
  tls:
  - secretName: rustfs
    hosts:
    - rustfs

apiVersion: v1
kind: Service
metadata:
  name: mailpit-tailscale
  namespace: mailpit
  annotations:
    tailscale.com/hostname: mailpit
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: mailpit
    app.kubernetes.io/name: mailpit
  ports:
  - name: http
    port: 80
    targetPort: 8025
    protocol: TCP
  - name: smtp
    port: 25
    targetPort: 1025
    protocol: TCP

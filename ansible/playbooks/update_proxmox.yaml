---
- name: Update Proxmox VE host and notify if reboot is required
  hosts: proxmox
  remote_user: root

  tasks:
    - name: Update package cache and upgrade all packages
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
        force_apt_get: true
    
    - name: Check if kernel update requires reboot
      shell: |
        if [ -f /var/run/reboot-required ] && grep -q "kernel" /var/run/reboot-required.pkgs 2>/dev/null; then
          echo "true"
        else
          echo "false"
        fi
      register: kernel_updated
      changed_when: false

    - name: Report when reboot is required
      debug:
        msg: "{{ inventory_hostname }} requires a reboot after Proxmox updates."
      when: kernel_updated.stdout == "true"